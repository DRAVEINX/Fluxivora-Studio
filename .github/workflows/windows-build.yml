name: Fluxivora Studio — Windows CI

on:
  push:
    branches: [main, master, feature/beta9-proxy-workflow-multicam]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies (registry fallback and retries)
        shell: pwsh
        run: |
          # Try the official registry first, then an alternate npm mirror.
          $registries = @(
            "https://registry.npmjs.org/",
            "https://registry.npmmirror.com/"
          )
          $attemptsPerRegistry = 2
          $installed = $false
          foreach ($registry in $registries) {
            for ($attempt = 1; $attempt -le $attemptsPerRegistry; $attempt++) {
              Write-Host "npm install attempt $attempt/$attemptsPerRegistry using $registry"
              npm install --no-audit --no-fund --registry=$registry --fetch-retries=3 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 --fetch-timeout=180000
              if ($LASTEXITCODE -eq 0) {
                $installed = $true
                break
              }
              Write-Warning "npm install failed with exit $LASTEXITCODE using $registry."
              if ($attempt -lt $attemptsPerRegistry) { Start-Sleep -Seconds (10 * $attempt) }
            }
            if ($installed) { break }
          }
          if (-not $installed) {
            throw "npm install failed on both configured registries. Review DNS, proxy/firewall access, and npm errors above."
          }

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit and UI contract tests
        run: npm test

      - name: Build Windows installer (disable implicit publishing)
        run: npm run dist:win -- --publish never

      - name: Verify packaged FFmpeg runtime and encoders
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $PWD "release/win-unpacked/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe"
          if (-not (Test-Path -Path $ffmpeg -PathType Leaf)) {
            throw "De FFmpeg-binary ontbreekt in resources/app.asar.unpacked van de Windows-app: $ffmpeg"
          }
          $version = & $ffmpeg -hide_banner -version 2>&1
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch "ffmpeg version") {
            throw "De in de app verpakte FFmpeg-binary start niet correct."
          }
          $encoders = & $ffmpeg -hide_banner -encoders 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Kan encoderlijst van de verpakte FFmpeg-binary niet lezen." }
          $encoderText = $encoders -join "`n"
          if ($encoderText -notmatch "\blibx264\b") { throw "De verpakte FFmpeg-binary mist de H.264/libx264-encoder." }
          if ($encoderText -notmatch "\baac\b") { throw "De verpakte FFmpeg-binary mist de AAC-encoder." }

      - name: Verify installer and create checksum manifest
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File)
          if ($installers.Count -lt 1) { throw "Geen Windows-installer gevonden in release/." }
          foreach ($installer in $installers) {
            if ($installer.Length -le 0) { throw "Installer is leeg: $($installer.Name)" }
          }
          $checksums = foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          Set-Content -Path "release/SHA256SUMS.txt" -Value $checksums -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fluxivora-Studio-Windows-Setup
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
